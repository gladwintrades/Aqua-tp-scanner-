# Repo mein .github/workflows/scanner.yml naam se rakhein (purani file ki jagah)
name: TrendPulse Fyers Scanner

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode (market band ho tab bhi chalega)"
        type: boolean
        default: false
      tf:
        description: "Test ke liye timeframe"
        type: choice
        options:
          - 15m
          - 5m
          - 30m
          - 1h
          - 1d
          - 1m
        default: 15m
      send:
        description: "Test result Telegram par bhi bhejo"
        type: boolean
        default: false

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fyers-apiv3 pandas numpy requests

      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run scanner
        env:
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          START=$(date +%s)
          if [ "${{ inputs.test }}" = "true" ]; then
            ARGS="--force --tf ${{ inputs.tf }}"
            if [ "${{ inputs.send }}" != "true" ]; then ARGS="$ARGS --dry"; fi
            python tp_fyers_scanner.py $ARGS
          else
            python tp_fyers_scanner.py
          fi
          echo "Scan time: $(( $(date +%s) - START )) sec"
